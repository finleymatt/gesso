<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Collection · Gesso</title>
<meta name="description" content="Your Gesso collection: the chips you hold, the art you own, and what your chips can buy.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,300..800&family=DM+Mono:wght@400;500&family=Permanent+Marker&family=VT323&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Syne:wght@600;700;800&display=swap">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="gesso.css">
<style>
  .top { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 20px 40px; align-items: end; padding-block: clamp(32px, 5vw, 64px) clamp(24px, 4vw, 40px); }
  .top .val { font-family: var(--display); font-weight: 800; font-size: clamp(3.4rem, 10vw, 7.5rem); line-height: .85; letter-spacing: -.05em; font-variation-settings: "wdth" 78; font-variant-numeric: tabular-nums; }
  .top .sub { display: flex; flex-wrap: wrap; gap: 8px 20px; font-size: var(--t-s); color: var(--ink-2); margin-top: 14px; }
  .sample { display: inline-flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: var(--t-xs); padding: 4px 10px; border: 1.5px dashed var(--ink-2); color: var(--ink-2); }
  @media (max-width: 700px) { .top { grid-template-columns: minmax(0, 1fr); } }

  .holds { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px; }
  .hold { display: grid; grid-template-rows: auto 1fr; border: 1px solid var(--rule); background: var(--card); text-decoration: none; box-shadow: 0 10px 24px -16px rgba(0,0,0,.5); transition: transform .25s; min-width: 0; }
  .hold:hover { transform: translateY(-4px); }
  .hold .sw { background: var(--c); color: var(--on); padding: 16px; display: grid; gap: 34px; position: relative; }
  .hold .sw .tick { font-family: var(--display); font-weight: 800; font-size: 2.2rem; letter-spacing: -.04em; line-height: .9; font-variation-settings: "wdth" 75; }
  .hold .sw .cnt { font-family: var(--mono); font-size: 1.15rem; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .hold .sw .cnt small { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; opacity: .85; }
  .hold .sw .no { position: absolute; top: 14px; right: 14px; font-family: var(--hand); font-size: 1.05rem; transform: rotate(4deg); }
  .hold .st { padding: 14px 16px; display: grid; gap: 6px; font-size: var(--t-s); }
  .hold .st .r { display: flex; justify-content: space-between; gap: 8px; }
  .hold .st .r .num { font-family: var(--mono); }
  .hold .st .r.big .num { font-size: 1.25rem; font-weight: 500; }

  .spend { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: clamp(16px, 3vw, 32px); }
  .spend .work .walllabel .price .earn { color: var(--cobalt); }
  @media (max-width: 800px) { .spend { grid-template-columns: repeat(2, minmax(0, 1fr)); } .spend > :nth-child(3) { display: none; } }

  .drip { display: grid; gap: 14px; padding: clamp(20px, 3vw, 28px); margin-bottom: clamp(32px, 5vw, 56px); border: 2px solid var(--ink); background: var(--card); }
  .drip.on { background: var(--cobalt-soft); border-color: var(--cobalt); }
  .tagp { font: 500 10px var(--mono); padding: 2px 6px; border: 1px dashed var(--ink-2); margin-left: 6px; }
  .dripbar { height: 10px; background: var(--wall-2); border-radius: 999px; overflow: hidden; }
  .dripbar i { display: block; height: 100%; background: linear-gradient(90deg, var(--cobalt), var(--up)); }
  .invite { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, .8fr); gap: clamp(20px, 4vw, 48px); padding: clamp(20px, 3vw, 32px); margin-bottom: clamp(32px, 5vw, 56px); border: 2px solid var(--ink); background: var(--cobalt-soft); align-items: start; }
  .codebox { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 10px 12px; background: var(--card); border: 1.5px dashed var(--ink-2); justify-self: start; }
  .codebox .mono { font-size: 1.2rem; letter-spacing: .06em; }
  .refs { display: grid; gap: 8px; }
  .ref { display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px; background: var(--card); font-size: var(--t-s); }
  .ref .av { width: 36px; height: 36px; border-radius: 50%; background: var(--ink); color: var(--wall); display: grid; place-items: center; font-weight: 800; }
  .ownedw { break-inside: avoid; margin-bottom: clamp(28px, 4vw, 48px); }
  .ownedw .work { margin-bottom: 10px; }
  .resell { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  @media (max-width: 760px) { .invite { grid-template-columns: minmax(0, 1fr); } }
  .log { width: 100%; border-collapse: collapse; font-size: var(--t-s); }
  .log td { padding: 14px 10px; border-bottom: 1px solid var(--rule); vertical-align: top; }
  .log td:first-child { font-family: var(--mono); font-size: var(--t-xs); color: var(--ink-2); white-space: nowrap; padding-left: 0; }
  .log td.num { font-family: var(--mono); text-align: right; white-space: nowrap; padding-right: 0; }
</style>
</head>
<body>
<div id="chrome-top"></div>
<main class="wrap" id="main"></main>
<div id="chrome-bottom"></div>
<script src="gesso.js"></script>
<script>
(function () {
  G.chrome('collection');
  const w = G.wallet();
  const holds = [...new Set([...Object.keys(w.chips), ...Object.keys(w.pending || {})])].map((k) => [k, w.chips[k] || 0]).map(([k, c]) => ({ k, c, a: G.artist(k), px: G.priceOf(k), v: c * G.priceOf(k), basis: w.basis[k] || 0 })).sort((a, b) => b.v - a.v);
  const total = holds.reduce((s, h) => s + h.v, 0), basis = holds.reduce((s, h) => s + h.basis, 0);
  const spent = w.spent || 0, tier = G.tierOf(spent), next = G.nextTier(spent), pend = w.pending || {};
  // milestone track on a square-root scale so the early steps aren't crushed together
  const MAX = G.TIERS[G.TIERS.length - 1].at, pos = (v) => Math.min(100, Math.sqrt(Math.min(v, MAX) / MAX) * 100);
  const ladder = `<div class="ladder" aria-label="Milestones: you have collected ${G.usd(spent)}">
    ${G.TIERS.slice(1).map((t, i, arr) => `<span class="lab ${i === arr.length - 1 || t === next ? 'keep' : ''}" style="left:${pos(t.at)}%"><b>${t.name}</b>${G.usd(t.at)}</span>`).join('')}
    <div class="track"><div class="fill" style="width:${pos(spent)}%"></div>${G.TIERS.slice(1).map((t) => `<i class="stop ${spent >= t.at ? 'on' : ''}" style="left:${pos(t.at)}%"></i>`).join('')}</div>
    <span class="you" style="left:${Math.max(4, Math.min(96, pos(spent)))}%">you, ${G.usd(spent)}</span></div>`;
  const mine = new Set(Object.keys(w.collectorNo));
  // pieces where chips cover the full allowed half, from artists you don't collect yet
  const ideas = G.works.filter((x) => !G.isSold(x) && !mine.has(x.artist) && x.price * G.SPEND_CAP <= total).sort((a, b) => b.price - a.price);
  const seen = new Set(), picks = [];
  ideas.forEach((x) => { if (!seen.has(x.artist) && picks.length < 3) { seen.add(x.artist); picks.push(x); } });
  const owned = w.owned.map(G.work).filter(Boolean);

  document.getElementById('main').innerHTML = `
    <section class="top">
      <div>
        <div style="display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:16px"><p class="eyebrow">Your chips are worth</p>${w.sample ? '<span class="sample">Sample collection</span>' : ''}</div>
        <div class="val">${G.usd(total, true)}</div>
        <div class="sub"><span class="${total - basis >= 0 ? 'up' : 'down'}" style="font-family:var(--mono)">${total - basis >= 0 ? '+' : '−'}${G.usd(Math.abs(total - basis), true)} since you earned them</span><span>${holds.length} artist${holds.length === 1 ? '' : 's'}</span><span>${owned.length} work${owned.length === 1 ? '' : 's'} owned</span></div>
      </div>
      <div class="cta-row"><button class="btn" type="button" id="share">Share my wall</button><a class="btn primary" href="discover.html">Spend chips</a></div>
    </section>

    <section class="section" id="milestones" aria-labelledby="h-ms" style="padding-top:8px">
      <div class="section-head"><div><p class="eyebrow">Milestones</p><h2 id="h-ms">You're at ${tier.name}</h2></div>
        <p class="muted" style="max-width:32em">${next ? `<b style="color:var(--ink)">${G.usd(next.at - spent)} more</b> reaches ${next.name}: ${G.esc(next.perks.join(', ').toLowerCase())}.` : 'You reached the top milestone. Thank you for keeping artists going.'} Everything you buy or back counts.</p></div>
      ${ladder}
      <div class="tiers" style="margin-top:28px">${G.TIERS.map((t) => `<div class="tier ${spent >= t.at ? 'on' : ''} ${t === tier ? 'cur' : ''}">${t === tier ? '<span class="tag">You</span>' : ''}<span class="amt">${t.at ? G.usd(t.at) + ' collected' : 'Start here'}</span><h3>${t.name}</h3><ul>${t.perks.map((x) => `<li>${G.esc(x)}</li>`).join('')}</ul></div>`).join('')}</div>
    </section>

    <section class="drip ${spent >= G.DRIP_AT ? 'on' : ''}" aria-labelledby="h-drip">
      <div style="display:grid;gap:8px"><p class="eyebrow">Weekly drip <span class="tagp">Planned</span></p>
        <h2 id="h-drip" style="font-size:1.9rem">${spent >= G.DRIP_AT ? `About ${G.usd(total * G.DRIP_RATE, true)} lands in your bank every Monday` : `Unlocks at ${G.usd(G.DRIP_AT)} spent`}</h2>
        <p class="muted">${spent >= G.DRIP_AT ? 'Each week 1% of your chips converts to cash and pays out to your bank. The rest keeps riding with the artists.' : `You're ${G.usd(G.DRIP_AT - spent)} away. At today's chip value it would pay about ${G.usd(total * G.DRIP_RATE, true)} a week, and grow as your artists gain collectors.`}</p></div>
      <div class="dripbar" aria-hidden="true"><i style="width:${Math.min(100, spent / G.DRIP_AT * 100)}%"></i></div>
      <p class="mono muted" style="font-size:var(--t-xs)">Paying chips out as cash needs legal and banking review before it can launch.</p>
    </section>

    <section class="invite" id="invite" aria-labelledby="h-inv">
      <div style="display:grid;gap:10px">
        <p class="eyebrow">Invite friends</p>
        <h2 id="h-inv" style="font-size:2rem">Bring someone in. You both get ${G.usd(G.REF_BONUS)} in chips.</h2>
        <p class="muted">When a friend collects their first piece, you each get ${G.usd(G.REF_BONUS)} in chips from that artist. A new collector also raises that artist's chip price, so the chips you already hold go up too.</p>
        <div class="codebox"><span class="mono" id="code">${G.refCode()}</span><button class="btn small" type="button" id="copy">Copy invite link</button></div>
        <span class="muted mono" style="font-size:var(--t-xs)" id="reflink"></span>
      </div>
      <div class="refs"><p class="eyebrow">Your invites</p>${G.referrals().map((r) => `<div class="ref"><span class="av">${G.esc(r.name[0])}</span><div><b>${G.esc(r.name)}</b><br><span class="muted">${G.esc(r.status)}</span></div><span class="mono ${r.chips ? 'up' : 'muted'}">${r.chips ? '+' + G.usd(r.chips) : 'waiting'}</span></div>`).join('')}</div>
    </section>

    <section aria-labelledby="h-chips">
      <div class="section-head"><div><p class="eyebrow">Chips</p><h2 id="h-chips">What you hold</h2></div><p class="muted" style="max-width:30em">Each one rises when a new person collects that artist. Your collector number never changes.</p></div>
      <div class="holds">${holds.map((h) => {
        const gain = h.basis ? h.v / h.basis - 1 : 0;
        return `<a class="hold" href="${G.creatorUrl(h.k)}" style="--c:${h.a.color};--on:${h.a.on}">
          <div class="sw">${w.collectorNo[h.k] ? `<span class="no">#${w.collectorNo[h.k]}${w.collectorNo[h.k] <= 25 ? ' ★' : ''}</span>` : ''}<span class="tick">$${h.a.ticker}</span><span class="cnt">${G.chips(h.c)}<small>chips</small></span></div>
          <div class="st"><div class="r big"><span>Worth</span><span class="num">${G.usd(h.v, true)}</span></div>
            <div class="r muted"><span>Per chip</span><span class="num">${G.usd(h.px, true)}</span></div>
            <div class="r muted"><span>Since earned</span><span class="num ${gain >= 0 ? 'up' : 'down'}">${G.pct(gain)}</span></div>
            ${pend[h.k] ? `<div class="r muted"><span>On the way</span><span class="num">+${G.chips(pend[h.k])}</span></div>` : ''}
            <div style="color:var(--up)">${G.spark(G.history(h.k).slice(-60).map(G.price), { h: 28 })}</div></div></a>`;
      }).join('') || '<p class="muted">No chips yet. Buy a piece to earn your first.</p>'}</div>
    </section>

    ${picks.length ? `<section class="section" aria-labelledby="h-spend" style="padding-bottom:0">
      <div class="section-head"><div><p class="eyebrow">Spend them</p><h2 id="h-spend">Half of these is already paid for</h2></div><p class="muted" style="max-width:30em">Your chips cover the full 50% on each of these, from artists you don't collect yet. Buying one earns you their chips too.</p></div>
      <div class="spend">${picks.map((x) => G.workCard(x).replace(/<span class="earn"[^>]*>[^<]*<\/span>/, `<span class="earn">pay ${G.usd(x.price / 2)} + chips</span>`)).join('')}</div>
    </section>` : ''}

    <section class="section" aria-labelledby="h-owned" style="padding-bottom:0">
      <div class="section-head"><div><p class="eyebrow">On your walls</p><h2 id="h-owned">Works you own</h2></div></div>
      <div class="salon">${owned.map((x) => `<div class="ownedw">` + G.workCard(x).replace(/<span class="red-dot"[^>]*><\/span>|<button class="quick-add"[^>]*>[^<]*<\/button>/, '').replace(/<span class="price">[\s\S]*?<\/span>\s*<\/span>/, `<span class="price"><span class="sold-tag" style="--sold:var(--up)">Yours</span><span class="earn">${x.edition === 'Original' ? 'Original' : G.esc(x.edition)}</span></span>`) + `<div class="resell">${(G.store.get('resales', []) || []).some((r) => r.id === x.id) ? `<span class="mono" style="font-size:var(--t-xs)">Listed for resale at ${G.usd((G.store.get('resales', []) || []).find((r) => r.id === x.id).ask)}</span><button class="link" type="button" data-unlist="${x.id}" style="background:none;border:0;padding:0;cursor:pointer;font-size:var(--t-xs)">Unlist</button>` : `<button class="btn small" type="button" data-resell="${x.id}">Resell</button><button class="link" type="button" data-coa="${x.id}" style="background:none;border:0;padding:0;cursor:pointer;font-size:var(--t-xs)">Certificate</button>`}</div></div>`).join('')}</div>
    </section>

    <section class="section" aria-labelledby="h-log" style="padding-bottom:0">
      <div class="section-head"><div><p class="eyebrow">Activity</p><h2 id="h-log">Your chip ledger</h2></div><button class="btn small" type="button" data-reset>Reset preview</button></div>
      <div style="overflow-x:auto"><table class="log"><tbody>${w.log.map((l) => { const a = G.artist(l.a) || { color: 'var(--ink-2)', ticker: 'GESSO' }; return `<tr><td>${new Date(l.t + 'T12:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })}</td><td><i class="dot" style="--c:${a.color}"></i> ${G.esc(l.text)}</td><td class="num ${l.chips >= 0 ? 'up' : 'down'}">${l.chips >= 0 ? '+' : '−'}${G.chips(Math.abs(l.chips))} $${a.ticker}</td></tr>`; }).join('')}</tbody></table></div>
    </section>`;
  G.hydrate();

  // invite link
  const link = new URL('index.html#ref-' + G.refCode(), location.href).href;
  document.getElementById('reflink').textContent = link;
  document.getElementById('copy').addEventListener('click', async (e) => {
    try { await navigator.clipboard.writeText(link); e.target.textContent = 'Copied'; } catch (err) { const r = document.createRange(); r.selectNodeContents(document.getElementById('reflink')); getSelection().removeAllRanges(); getSelection().addRange(r); e.target.textContent = 'Selected, press copy'; }
  });
  if (location.hash === '#invite') document.getElementById('invite').scrollIntoView();

  // resell a piece you own
  document.querySelectorAll('[data-coa]').forEach((b) => b.addEventListener('click', () => G.certificate(G.work(b.dataset.coa))));
  document.querySelectorAll('[data-unlist]').forEach((b) => b.addEventListener('click', () => { G.store.set('resales', (G.store.get('resales', []) || []).filter((r) => r.id !== b.dataset.unlist)); location.reload(); }));
  document.querySelectorAll('[data-resell]').forEach((b) => b.addEventListener('click', () => {
    const x = G.work(b.dataset.resell), a = G.artist(x.artist);
    const body = G.sheet(`<p class="eyebrow">Resell on Gesso</p><h2 style="font-size:1.9rem;margin:6px 0 12px">${G.esc(x.title)}</h2>
      <div class="field"><label for="ask">Your price (USD)</label><input class="input mono" id="ask" type="number" min="10" value="${Math.round(x.price * 1.1)}"></div>
      <div id="split" style="display:grid;gap:6px;margin-top:14px;font-size:var(--t-s)"></div>
      <div class="field" style="margin-top:12px"><label for="why">A note for buyers (optional)</label><input class="input" id="why" maxlength="80" placeholder="Why it's moving on"></div>
      <button class="btn primary block" type="button" id="list" style="margin-top:16px">List for resale</button>
      <p class="mono muted" style="font-size:var(--t-xs);margin-top:10px">Gesso ships it from you to the buyer and updates its ownership history. Preview: nothing is listed publicly.</p>`);
    const ask = body.querySelector('#ask');
    const upd = () => { const v = Math.max(10, +ask.value || 0); body.querySelector('#split').innerHTML = `<div style="display:flex;justify-content:space-between"><span>To ${G.esc(a.name)} (${Math.round(G.ROYALTY * 100)}%, every resale)</span><b class="mono">${G.usd(v * G.ROYALTY, true)}</b></div><div style="display:flex;justify-content:space-between"><span>Gesso (5%)</span><b class="mono">${G.usd(v * 0.05, true)}</b></div><div style="display:flex;justify-content:space-between;border-top:1px solid var(--rule);padding-top:6px"><span>You get</span><b class="mono">${G.usd(v * 0.85, true)}</b></div>`; };
    ask.addEventListener('input', upd); upd();
    body.querySelector('#list').addEventListener('click', () => { const l = (G.store.get('resales', []) || []).filter((r) => r.id !== x.id); l.push({ id: x.id, ask: Math.max(10, +ask.value || 0), note: body.querySelector('#why').value.trim() }); G.store.set('resales', l); G.closeSheet(); location.reload(); });
  }));

  // share card
  document.getElementById('share').addEventListener('click', async () => {
    const body = G.sheet('<p class="eyebrow">Share my wall</p><div id="sc" style="display:grid;place-items:center;min-height:240px;margin-top:10px"><span class="spin"></span></div>', { wide: false });
    const blob = await G.shareCard(), url = URL.createObjectURL(blob), file = new File([blob], 'my-gesso-wall.png', { type: 'image/png' });
    const canShare = navigator.canShare && navigator.canShare({ files: [file] });
    body.querySelector('#sc').innerHTML = `<img src="${url}" alt="Your Gesso wall as a shareable card" style="width:100%;max-width:360px;box-shadow:var(--hang)"><div class="cta-row" style="margin-top:16px;justify-content:center">${canShare ? '<button class="btn primary" type="button" id="doshare">Share</button>' : ''}<a class="btn ${canShare ? '' : 'primary'}" href="${url}" download="my-gesso-wall.png">Save image</a></div>`;
    const ds = body.querySelector('#doshare'); if (ds) ds.addEventListener('click', () => navigator.share({ files: [file], title: 'My Gesso wall' }).catch(() => {}));
  });
})();
</script>
</body>
</html>
