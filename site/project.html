<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Projects · Gesso</title>
<meta name="description" content="Back something specific an artist wants to make. Every pledge earns you their chips.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Gesso">
<meta property="og:title" content="Projects · Gesso">
<meta property="og:description" content="Back something specific an artist wants to make. Every pledge earns you their chips.">
<meta property="og:url" content="https://finleymatt.github.io/gesso/project.html">
<meta property="og:image" content="https://finleymatt.github.io/gesso/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Four paintings by HAMEL beside the words Find your own faces.">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,300..800&family=DM+Mono:wght@400;500&family=Permanent+Marker&family=VT323&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Syne:wght@600;700;800&display=swap">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="gesso.css">
<style>
  .head { padding-block: clamp(32px, 5vw, 64px) 28px; display: grid; gap: 16px; max-width: 46em; }
  .how { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; margin: 8px 0 36px; }
  .how div { border-top: 2px solid var(--ink); padding-top: 14px; display: grid; gap: 6px; }
  .how b { font-size: var(--t-l); letter-spacing: -.01em; }
  .how p { color: var(--ink-2); font-size: var(--t-s); }
  @media (max-width: 760px) { .how { grid-template-columns: minmax(0, 1fr); } }

  .crumbs { display: flex; flex-wrap: wrap; gap: 8px; font-size: var(--t-s); color: var(--ink-2); padding-block: 20px; }
  .crumbs a { text-decoration: none; color: var(--ink-2); }
  .pj { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: clamp(28px, 5vw, 64px); align-items: start; }
  .pj .hero-img .art { aspect-ratio: 4 / 3; object-fit: cover; }
  .side { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 84px); display: grid; gap: 18px; }
  .side h1 { font-family: var(--display); font-weight: 800; font-size: clamp(2.2rem, 4.4vw, 3.4rem); line-height: .92; letter-spacing: -.04em; font-variation-settings: "wdth" 82; margin: 0; }
  .big-prog .progress { height: 14px; }
  .nums { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; background: var(--rule); border: 1px solid var(--rule); }
  .nums div { background: var(--wall); padding: 12px 14px; display: grid; gap: 2px; }
  .nums b { font-family: var(--mono); font-weight: 500; font-size: 1.3rem; }
  .nums span { font-size: var(--t-xs); color: var(--ink-2); }
  .example { font: 500 var(--t-xs) var(--mono); padding: 8px 12px; border: 1.5px dashed var(--ink-2); color: var(--ink-2); }
  .story { display: grid; gap: 28px; margin-top: 32px; }
  .story h2 { font-size: 1.7rem; }
  .budget { display: grid; gap: 10px; }
  .budget .row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; font-size: var(--t-s); }
  .budget .row .bar { grid-column: 1 / -1; height: 8px; background: var(--wall-2); }
  .budget .row .bar i { display: block; height: 100%; }
  .budget .num { font-family: var(--mono); }
  .rewards { display: grid; gap: 10px; }
  .reward { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 16px; align-items: center; padding: 16px; background: var(--card); border: 1px solid var(--rule); }
  .reward .amt { font-family: var(--mono); font-size: 1.2rem; }
  .reward p { color: var(--ink-2); font-size: var(--t-s); grid-column: 1; }
  .reward .left { font: 500 11px var(--mono); color: var(--marker); }
  .reward .btn { grid-row: 1 / span 3; grid-column: 2; }
  .updates { display: grid; gap: 14px; }
  .updates div { display: grid; grid-template-columns: 70px minmax(0, 1fr); gap: 12px; font-size: var(--t-s); }
  .updates .d { font-family: var(--mono); color: var(--ink-2); font-size: var(--t-xs); padding-top: 2px; }
  .amtrow { display: flex; flex-wrap: wrap; gap: 8px; }
  @media (max-width: 900px) { .pj { grid-template-columns: minmax(0, 1fr); } .side { position: static; } }
</style>
</head>
<body>
<div id="chrome-top"></div>
<main class="wrap" id="main"></main>
<div id="chrome-bottom"></div>
<script src="gesso.js"></script>
<script>
(function () {
  G.chrome('projects');
  const main = document.getElementById('main');

  function index() {
    document.title = 'Projects · Gesso';
    main.innerHTML = `
      <section class="head"><p class="eyebrow">Projects</p><h1 class="display" style="font-size:clamp(2.6rem,7vw,5rem)">Back what an artist makes next</h1>
        <p class="lede">A wall, a new press, a research trip. Artists post one project at a time with a clear goal and a budget. Pledge any amount and get a reward and chips.</p></section>
      <div class="how">
        <div><b>All or nothing</b><p>You're only charged if the project hits its goal before the deadline.</p></div>
        <div><b>Pledges earn chips</b><p>When a project is funded, every backer gets 10% back in the artist's chips, like any purchase.</p></div>
        <div><b>Pay over time</b><p>Big pledges can be split into monthly payments at no interest.</p></div>
      </div>
      <div class="cards">${G.projects.map(G.projectCard).join('')}</div>`;
    G.hydrate();
  }

  function detail(p) {
    const a = G.artist(p.artist), n = G.collectors(p.artist), raised = G.raised(p), pct = Math.min(100, (raised / p.goal) * 100);
    const mine = G.pledged(p), total = p.budget.reduce((s, b) => s + b[1], 0);
    document.title = p.title + ' · ' + a.name + ' · Gesso';
    const r = G.rng(G.hash('backers' + p.id)), F = ['Priya', 'Marcus', 'Lena', 'Dante', 'Sol', 'Imani', 'Theo', 'Rosa', 'Kenji', 'Aisha', 'Wes', 'Noor'];
    main.innerHTML = `
      <nav class="crumbs" aria-label="Breadcrumb"><a href="project.html">Projects</a><span>/</span><a href="artist.html#${a.slug}">${G.esc(a.name)}</a></nav>
      <div class="pj">
        <div>
          <div class="hero-img">${G.projectImg(p, 1100)}</div>
          <div class="story">
            <div style="display:grid;gap:12px"><h2>The idea</h2><p class="lede" style="color:var(--ink)">${G.esc(p.story)}</p></div>
            <div style="display:grid;gap:14px"><h2>Where the money goes</h2><div class="budget">${p.budget.map(([l, v]) => `<div class="row"><span>${G.esc(l)}</span><span class="num">${G.usd(v)}</span><div class="bar"><i style="width:${(v / total) * 100}%;background:${a.color}"></i></div></div>`).join('')}</div></div>
            ${p.updates.length ? `<div style="display:grid;gap:14px"><h2>Updates</h2><div class="updates">${p.updates.map(([d, t]) => `<div><span class="d">${d}</span><span>${G.esc(t)}</span></div>`).join('')}</div></div>` : ''}
            <div style="display:grid;gap:10px"><h2>Recent backers</h2><p class="muted" style="font-size:var(--t-s)">${Array.from({ length: 8 }, () => F[Math.floor(r() * F.length)] + ' ' + String.fromCharCode(65 + Math.floor(r() * 26)) + '.').join(', ')} and ${p.backers - 8} more</p></div>
          </div>
        </div>
        <aside class="side">
          ${p.example ? '<p class="example">Example project for the design preview. HAMEL hasn\'t launched this.</p>' : ''}
          <a class="who" href="artist.html#${a.slug}"><i class="dot" style="--c:${a.color}"></i>${G.esc(a.name)}</a>
          <h1>${G.esc(p.title)}</h1>
          <div class="big-prog"><div class="progress"><i style="width:${pct}%;background:${a.color}"></i></div></div>
          <div class="nums"><div><b>${G.usd(raised)}</b><span>of ${G.usd(p.goal)}</span></div><div><b>${p.backers + (mine ? 1 : 0)}</b><span>backers</span></div><div><b>${p.daysLeft}</b><span>days left</span></div></div>
          ${mine ? `<p class="mono" style="font-size:var(--t-s);color:var(--up)">✓ You've pledged ${G.usd(mine)}</p>` : ''}
          <button class="btn primary block" type="button" data-back="0">Back this project</button>
          <div style="display:grid;gap:10px"><p class="eyebrow">Rewards</p><div class="rewards">${p.rewards.map((rw, i) => `
            <div class="reward"><span class="amt">${G.usd(rw.amt)}+</span><b>${G.esc(rw.title)}</b><p>${G.esc(rw.text)}</p>${rw.left ? `<span class="left">${rw.left} left</span>` : ''}<button class="btn small" type="button" data-back="${rw.amt}">Back</button></div>`).join('')}</div></div>
          <p class="muted" style="font-size:var(--t-xs)">Pledges earn ${Math.round(G.myRate() * 100)}% back in $${a.ticker} when the project is funded. A ${G.usd(100)} pledge earns ${G.chips(G.chipsFor(100, n, G.myRate()))} chips at today's price.</p>
        </aside>
      </div>`;
    G.hydrate();
    main.querySelectorAll('[data-back]').forEach((b) => b.addEventListener('click', () => back(p, +b.dataset.back || 50)));
  }

  function back(p, amt) {
    const a = G.artist(p.artist), n = G.collectors(p.artist);
    const body = G.sheet(`<p class="eyebrow">Back ${G.esc(a.name)}</p><h2 style="font-size:1.9rem;margin:8px 0 14px">${G.esc(p.title)}</h2>
      <div class="field"><label for="amt">Your pledge (USD)</label><input class="input mono" id="amt" type="number" min="5" step="1" value="${amt}" autofocus></div>
      <div class="amtrow" style="margin-top:10px">${[25, 50, 100, 250, 500].map((v) => `<button type="button" class="pill" data-v="${v}">${G.usd(v)}</button>`).join('')}</div>
      <p id="rw" style="margin-top:14px;font-size:var(--t-s)"></p>
      <div class="plans" style="margin-top:14px" id="pp"></div>
      <p id="ch" class="mono" style="margin-top:12px;font-size:var(--t-s);color:var(--cobalt)"></p>
      <button class="btn primary block" type="button" id="go" style="margin-top:16px">Pledge</button>
      <p class="mono muted" style="font-size:var(--t-xs);margin-top:10px">Charged only if the project is funded. Preview: nothing is charged.</p>`);
    const amtEl = body.querySelector('#amt');
    let plan = 'full';
    const upd = () => {
      const v = Math.max(5, +amtEl.value || 0), rw = p.rewards.filter((x) => v >= x.amt).pop(), c = G.chipsFor(v, n, G.myRate());
      body.querySelector('#rw').innerHTML = rw ? `Reward: <b>${G.esc(rw.title)}</b>. ${G.esc(rw.text)}` : `Pledge ${G.usd(p.rewards[0].amt)} or more for a reward. Smaller pledges still earn chips.`;
      const ps = v >= 100 ? [{ id: 'full', name: 'Pay when funded', today: v, n: 0 }, { id: 'm3', name: 'Split over 3 months', today: v / 3, n: 2, each: v / 3 }] : [{ id: 'full', name: 'Pay when funded', today: v, n: 0 }];
      if (!ps.find((x) => x.id === plan)) plan = 'full';
      body.querySelector('#pp').innerHTML = ps.map((x) => `<label class="plan"><input type="radio" name="pp" value="${x.id}" ${x.id === plan ? 'checked' : ''}><span><span class="n">${x.name}</span><br><span class="d">${x.n ? '0% interest, starts when funded' : 'One payment, only if funded'}</span></span><span class="p">${G.usd(x.today, true)}<small>${x.n ? `then ${x.n} more` : 'once'}</small></span></label>`).join('');
      body.querySelectorAll('input[name="pp"]').forEach((r) => r.addEventListener('change', () => (plan = r.value)));
      body.querySelector('#ch').textContent = `Earns ${G.chips(c)} $${a.ticker} when funded, worth ${G.usd(c * G.price(n), true)} today`;
      body.querySelector('#go').textContent = `Pledge ${G.usd(v)}`;
    };
    amtEl.addEventListener('input', upd);
    body.querySelectorAll('[data-v]').forEach((b) => b.addEventListener('click', () => { amtEl.value = b.dataset.v; upd(); }));
    body.querySelector('#go').addEventListener('click', () => {
      const v = Math.max(5, +amtEl.value || 0), c = G.chipsFor(v, n, G.myRate());
      const pl = G.store.get('pledged', {}) || {}; pl[p.id] = (pl[p.id] || 0) + v; G.store.set('pledged', pl);
      const w = G.wallet(); w.pending = w.pending || {}; w.pending[p.artist] = (w.pending[p.artist] || 0) + c; w.spent = (w.spent || 0) + v; w.sample = false;
      w.log.unshift({ t: '2026-10-17', text: `Pledged ${G.usd(v)} to ${p.title}`, chips: 0, a: p.artist }); G.saveWallet(w);
      body.innerHTML = `<p class="eyebrow">Pledged</p><h2 style="font-size:2rem;margin:8px 0">Thank you for backing ${G.esc(a.name)}.</h2>
        <p class="muted">${G.chips(c)} $${a.ticker} chips are waiting in your collection and arrive when the project is funded. Nothing was charged in this preview.</p>
        <div class="cta-row" style="margin-top:18px"><button class="btn primary" type="button" data-close>Done</button><a class="btn" href="collection.html">Your collection</a></div>`;
      body.querySelector('[data-close]').addEventListener('click', () => detail(p));
    });
    upd();
  }

  function route() { const p = G.project(location.hash.slice(1)); p ? detail(p) : index(); window.scrollTo(0, 0); }
  window.addEventListener('hashchange', route);
  route();
})();
</script>
</body>
</html>
