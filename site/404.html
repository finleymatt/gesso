<style>
  :root { --wall: #FBF7EF; --ink: #16151B; --ink-2: #625D55; --rule: #E2DACB; --marker: #DC1F68; color-scheme: light; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--wall); color: var(--ink); font-family: 'Bricolage Grotesque', system-ui, sans-serif; padding: 24px 16px; box-sizing: border-box; }
  main { display: grid; justify-items: center; gap: 20px; text-align: center; max-width: 34em; }
  .frame { width: min(70vw, 260px); aspect-ratio: 3 / 4; border: 3px dashed var(--rule); display: grid; place-items: center; position: relative; }
  .frame span { font-family: 'Permanent Marker', cursive; color: var(--marker); font-size: 1.4rem; transform: rotate(-6deg); }
  .k { font: 400 22px 'VT323', monospace; letter-spacing: .1em; color: var(--ink-2); }
  h1 { font-weight: 800; font-size: clamp(2.4rem, 8vw, 4rem); line-height: .95; letter-spacing: -.045em; margin: 0; font-variation-settings: "wdth" 82; }
  p { color: var(--ink-2); margin: 0; font-size: 1.1rem; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  a.btn { display: inline-flex; align-items: center; min-height: 48px; padding: 0 22px; border: 2px solid var(--ink); color: var(--ink); text-decoration: none; font-weight: 700; }
  a.btn.p { background: var(--ink); color: var(--wall); }
</style>
