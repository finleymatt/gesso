<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gesso</title>
<meta name="description" content="Gesso: an art market owned by the people who collect it. Buy art, earn the artist's chips, spend them on more art.">
<meta name="theme-color" content="#0B0C0F">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,300..800&family=DM+Mono:wght@400;500&family=Permanent+Marker&family=VT323&display=swap">
<link rel="stylesheet" href="gesso.css">
<style>
  body { min-height: 100vh; display: flex; flex-direction: column; }
  .stage { flex: 1; display: grid; place-items: center; padding: clamp(32px, 8vh, 96px) var(--gut); }
  .center { display: grid; justify-items: center; gap: 22px; text-align: center; width: 100%; max-width: 980px; }
  .enter { border: 0; background: none; padding: 0; cursor: pointer; border-radius: 50%; }
  .enter .glogo { --s: clamp(190px, 34vw, 300px); box-shadow: 0 30px 60px -30px rgba(0,0,0,.45); }
  .enter .glogo span { transform: rotate(-9deg); }
  .enter:hover .glogo { transform: rotate(-6deg) scale(1.03); }
  .enter:focus-visible { outline: 3px solid var(--cobalt); outline-offset: 8px; }
  .tag { font-size: clamp(1.05rem, 2vw, 1.3rem); color: var(--ink-2); max-width: 30em; }
  .hint { font-family: var(--board); font-size: 22px; letter-spacing: .08em; color: var(--ink-2); animation: blink 1.4s steps(2) infinite; }
  @keyframes blink { 50% { opacity: .35; } }
  .opened .enter .glogo { --s: clamp(110px, 16vw, 150px); }
  .opened .hint { display: none; }

  .doors { width: 100%; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; text-align: left; margin-top: 10px; }
  .door { position: relative; display: grid; grid-template-rows: auto 1fr; min-height: 210px; background: var(--card); border: 2px solid var(--ink); text-decoration: none; overflow: hidden; animation: pop .45s cubic-bezier(.2,1.3,.4,1) backwards; animation-delay: calc(var(--i) * 55ms); transition: transform .2s, box-shadow .2s; }
  .door:hover { transform: translate(-3px, -3px); box-shadow: 6px 6px 0 var(--ink); }
  @keyframes pop { from { transform: translateY(14px) scale(.96); opacity: 0; } }
  .door .pic { height: 96px; background: var(--c, var(--wall-2)) center / cover; border-bottom: 2px solid var(--ink); }
  .door .txt { padding: 14px 40px 16px 16px; display: grid; gap: 4px; align-content: start; }
  .door .k { font-family: var(--board); font-size: 20px; color: var(--ink-2); letter-spacing: .06em; }
  .door b { font-family: var(--display); font-weight: 800; font-size: 1.7rem; letter-spacing: -.035em; line-height: 1; font-variation-settings: "wdth" 82; }
  .door span { font-size: var(--t-s); color: var(--ink-2); }
  .door .arrow { position: absolute; right: 14px; bottom: 12px; font-size: 1.3rem; }
  .smalls { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 22px; font-size: var(--t-s); margin-top: 8px; }
  .smalls a { color: var(--ink-2); }
  @media (max-width: 760px) { .doors { grid-template-columns: repeat(2, minmax(0, 1fr)); } .door { min-height: 180px; } .door .pic { height: 72px; } .door b { font-size: 1.35rem; } }
  @media (prefers-reduced-motion: reduce) { .hint { animation: none; } }
</style>
</head>
<body>
<div id="board"></div>
<main class="stage">
  <div class="center" id="center">
    <button class="enter" type="button" id="enter" aria-expanded="false" aria-controls="doors" aria-label="Enter Gesso"></button>
    <p class="tag">An art market owned by the people who collect it.</p>
    <p class="hint" id="hint">▶ TAP THE CIRCLE TO ENTER</p>
    <nav class="doors" id="doors" hidden aria-label="Gesso"></nav>
    <div class="smalls" id="smalls" hidden><a href="collection.html">Your collection</a><a href="how-it-works.html">How chips work</a><a href="project.html">Projects</a><a href="visit.html">Visit</a><a href="for-artists.html">Sell on Gesso</a></div>
  </div>
</main>
<script src="gesso.js"></script>
<script>
(function () {
  document.getElementById('board').outerHTML = G.pulse();
  document.getElementById('enter').innerHTML = G.logo();
  // keep the chosen theme (white unless someone picks dark)
  const t = G.store.get('theme', 'light'); if (t !== 'system') document.documentElement.setAttribute('data-theme', t);
  const art = (id) => G.workArt(G.work(id), 560);
  const doors = [
    ['artists.html', 'Artists', `${G.artists.length} artists and growing`, art('hamel-j16')],
    ['mission.html', 'Mission', 'Why Gesso exists, and how collectors vote', art('hamel-j17')],
    ['now.html', 'Now', "What's new, the chip board, live projects", art('hamel-j11')],
    ['discover.html', 'Shop', 'Originals, prints, hoodies and wallpaper', art('hamel-j19')],
    ['book.html', 'FAME', 'Book chefs, DJs, musicians and makers', 'art/justin/j29.jpg'],
    ['partners.html', 'Partners', 'Places and brands that take chips', art('hamel-j20')]
  ];
  const d = document.getElementById('doors');
  d.innerHTML = doors.map(([h, b, s, img], i) => `<a class="door" href="${h}" style="--i:${i}"><div class="pic" style="background-image:url('${img}')"></div><div class="txt"><span class="k">0${i + 1}</span><b>${b}</b><span>${s}</span></div><span class="arrow" aria-hidden="true">→</span></a>`).join('');
  const open = () => {
    const c = document.getElementById('center'), b = document.getElementById('enter'), was = !d.hidden;
    d.hidden = was; document.getElementById('smalls').hidden = was; c.classList.toggle('opened', !was);
    b.setAttribute('aria-expanded', String(!was));
    if (!was) G.store.set('entered', true);
  };
  document.getElementById('enter').addEventListener('click', open);
  if (location.hash === '#menu') open();
})();
</script>
</body>
</html>
