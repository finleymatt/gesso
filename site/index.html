<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gesso</title>
<meta name="description" content="Gesso: an art market owned by the people who collect it. Buy art, earn the artist's chips, spend them on more art.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Gesso">
<meta property="og:title" content="Gesso">
<meta property="og:description" content="Gesso: an art market owned by the people who collect it. Buy art, earn the artist's chips, spend them on more art.">
<meta property="og:url" content="https://finleymatt.github.io/gesso/">
<meta property="og:image" content="https://finleymatt.github.io/gesso/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Four paintings by HAMEL beside the words Find your own faces.">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#0B0C0F">
<script>
  // Returning visitors go straight in; the intro is for the first visit (or index.html#intro).
  try { if (/^#ref-/.test(location.hash)) localStorage.setItem('gesso:referredBy', JSON.stringify(location.hash.slice(5)));
    else if (localStorage.getItem('gesso:entered') && location.hash !== '#intro') location.replace('now.html'); } catch (e) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,300..800&family=DM+Mono:wght@400;500&family=Permanent+Marker&family=VT323&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Syne:wght@600;700;800&display=swap">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="gesso.css">
<style>
  body { min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }
  .stage { flex: 1; display: grid; place-items: center; padding: clamp(28px, 6vh, 72px) var(--gut) clamp(28px, 5vh, 56px); }
  .center { display: grid; justify-items: center; gap: clamp(18px, 3vh, 28px); text-align: center; }

  /* the logo, with Justin's work slowly orbiting it */
  .orbit { --r: clamp(150px, 27vw, 230px); --t: clamp(46px, 7.5vw, 74px); position: relative; width: min(100%, calc(var(--r) * 2 + var(--t))); aspect-ratio: 1; display: grid; place-items: center; }
  .ring { position: absolute; inset: 0; animation: spin 90s linear infinite; }
  .ring img { position: absolute; left: 50%; top: 50%; width: var(--t); height: var(--t); margin: calc(var(--t) / -2) 0 0 calc(var(--t) / -2); border-radius: 50%; object-fit: cover; border: 3px solid var(--wall); box-shadow: 0 8px 18px -8px rgba(40, 30, 10, .45);
    transform: rotate(var(--a)) translate(var(--r)) rotate(calc(-1 * var(--a))); }
  .ring img:nth-child(even) { width: calc(var(--t) * .78); height: calc(var(--t) * .78); margin: calc(var(--t) * -.39) 0 0 calc(var(--t) * -.39); }
  @keyframes spin { to { transform: rotate(360deg); } }
  .track-line { position: absolute; inset: calc(var(--t) / 2); border-radius: 50%; border: 1px dashed var(--rule); }

  .enter { position: relative; z-index: 2; border: 0; background: none; padding: 0; cursor: pointer; border-radius: 50%; }
  .enter .glogo { --s: clamp(150px, 24vw, 220px); box-shadow: 0 26px 50px -26px rgba(30, 20, 5, .55); transition: transform .5s cubic-bezier(.2,1.2,.3,1); }
  .enter .glogo span { transform: rotate(-9deg); }
  .enter:hover .glogo { transform: rotate(-6deg) scale(1.04); }
  .enter:focus-visible { outline: 3px solid var(--cobalt); outline-offset: 8px; }
  .enter .cue { position: absolute; left: 50%; bottom: 15%; transform: translateX(-50%); font: 400 17px/1 var(--board); letter-spacing: .14em; color: var(--wall); opacity: .75; white-space: nowrap; animation: blink 1.6s steps(2) infinite; }
  @keyframes blink { 50% { opacity: .25; } }

  /* one tap: the black circle swallows the screen, then the site opens */
  .go .enter .glogo { transform: scale(18); transition: transform .65s cubic-bezier(.7,0,.3,1); }
  .go .enter .glogo span, .go .enter .cue, .go .ring, .go .track-line, .go .after { opacity: 0; transition: opacity .2s; }

  .tag { font-size: clamp(1.1rem, 2.1vw, 1.35rem); color: var(--ink-2); max-width: 26em; text-wrap: balance; }
  .tag b { color: var(--ink); font-weight: 700; }
  .invited { font-weight: 700; background: #FFE14D; color: #16151B; padding: 8px 14px; border-radius: 999px; font-size: var(--t-s); }
  .quick { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 6px; }
  .quick a { font: 400 21px/1 var(--board); letter-spacing: .1em; text-decoration: none; color: var(--ink); padding: 8px 10px; border-radius: 4px; }
  .quick a:hover { background: var(--ink); color: var(--wall); }
  .quick span { font: 400 21px/1 var(--board); color: var(--rule); align-self: center; }
  @media (max-width: 520px) { .quick a, .quick span { font-size: 18px; } .quick a { padding: 6px; } }
  @media (prefers-reduced-motion: reduce) { .ring, .enter .cue { animation: none; } .go .enter .glogo { transition: none; } }
</style>
</head>
<body>
<div id="board"></div>
<main class="stage">
  <div class="center" id="center">
    <div class="orbit"><span class="track-line" aria-hidden="true"></span><div class="ring" id="ring" aria-hidden="true"></div>
      <button class="enter" type="button" id="enter" aria-label="Enter Gesso"></button></div>
    <p class="invited after" id="invited" hidden></p>
    <p class="tag after">An art market owned by the people who collect it. <b>Buy art, earn the artist's chips, spend them on more art.</b></p>
    <nav class="quick after" aria-label="Go straight to"></nav>
  </div>
</main>
<script src="gesso.js"></script>
<script>
(function () {
  document.getElementById('board').outerHTML = G.looksBar() + G.pulse();
  document.getElementById('enter').innerHTML = G.logo() + '<span class="cue" aria-hidden="true">ENTER</span>';
  const t = G.store.get('theme', 'light'); document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light');
  const ids = ['hamel-j16', 'hamel-j11', 'hamel-j19', 'hamel-j20', 'hamel-j06', 'hamel-j12', 'hamel-j02', 'hamel-j17', 'hamel-j22', 'hamel-j01'];
  document.getElementById('ring').innerHTML = ids.map((id, i) => `<img src="${G.workArt(G.work(id), 200)}" alt="" style="--a:${(360 / ids.length) * i}deg">`).join('');
  const links = [['now.html', 'NOW'], ['artists.html', 'ARTISTS'], ['discover.html', 'SHOP'], ['book.html', 'FAME'], ['mission.html', 'MISSION'], ['partners.html', 'PARTNERS']];
  document.querySelector('.quick').innerHTML = links.map(([h, l]) => `<a href="${h}">${l}</a>`).join('<span aria-hidden="true">·</span>');
  const ref = G.store.get('referredBy', null);
  if (ref) { const el = document.getElementById('invited'); el.hidden = false; el.textContent = `A collector invited you (${ref}). Your first piece comes with ${G.usd(G.REF_BONUS)} in chips.`; }
  const remember = () => G.store.set('entered', true);
  document.querySelectorAll('.quick a').forEach((a) => a.addEventListener('click', remember));
  document.getElementById('enter').addEventListener('click', () => {
    remember();
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) { location.href = 'now.html'; return; }
    document.getElementById('center').classList.add('go');
    setTimeout(() => (location.href = 'now.html'), 600);
  });
})();
</script>
</body>
</html>
