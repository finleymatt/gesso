name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Pages lets browsers cache files for 10 minutes. Versioned links make a new page
      # always fetch the scripts and styles it was built with.
      - name: Stamp asset versions
        run: |
          V="${GITHUB_SHA::8}"
          sed -i -E "s#(href|src)=\"(gesso\.css|gesso\.js|room\.js)\"#\1=\"\2?v=$V\"#g" site/*.html
          grep -c "?v=$V" site/*.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
